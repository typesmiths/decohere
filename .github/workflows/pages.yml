name: Pages

on:
  # CI doesn't run on main: the merge queue tested this commit, and its run holds the coverage.
  push:
    branches: [main]

# Shared with bench.yml: both deploy the whole site, so they take turns instead of racing.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CI_TOOLS: projects/ci-tools/src

jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-pnpm

      - name: Find the merge queue's run of this commit
        id: tested
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          run_id="$(node ${{ env.CI_TOOLS }}/release/tested-build.command.mjs "$SHA" merge_group)"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          name: coverage-data
          run-id: ${{ steps.tested.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist/coverage

      - name: Generate CI status badges
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node ${{ env.CI_TOOLS }}/badges/ci-status.mjs

      - name: Generate coverage badges
        run: node ${{ env.CI_TOOLS }}/coverage/badge.mjs

      # Benchmarks run nightly in bench.yml; this deploy carries their history over unchanged.
      - name: Restore benchmark history from Pages
        run: node ${{ env.CI_TOOLS }}/pages/restore-bench-history.mjs

      - name: Generate Pages site artifact
        env:
          PAGES_OUTPUT_DIR: dist/site
        run: node ${{ env.CI_TOOLS }}/pages/artifact.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  failure-report:
    needs: [pages]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/failure-report
