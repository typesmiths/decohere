name: Release
on:
  workflow_call:
    inputs:
      channel:
        description: "Release channel: stable (build/release from merged state) or branch (dry-run validation)"
        required: false
        type: string
        default: stable
      dry_run:
        description: "Run release commands in dry-run mode (for local validation)"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        type: choice
        options:
          - stable
          - branch
        default: stable
      dry_run:
        description: "Run release commands in dry-run mode"
        required: false
        type: boolean
        default: false
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  SCRIBE_LOG_LEVEL: info
  RELEASE_SCRIPTS: projects/ci-tools/src/release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      version: ${{ steps.final-meta.outputs.version }}
      is_prerelease: ${{ steps.final-meta.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PUSH_TOKEN || github.token }}
      - uses: ./.github/actions/setup-node-pnpm
        with:
          configure-git: "true"
      - name: Version branch prerelease (dry-run)
        if: inputs.channel == 'branch'
        run: |
          pnpm forge --log-level info version --release-type prerelease --channel dev --dry-run true

      - name: Build release artifacts
        run: |
          pnpm forge --log-level info build --configuration release

      - name: Dry-run release pipeline (branch validation)
        if: inputs.channel == 'branch'
        run: |
          pnpm forge --log-level info dependencies --configuration release report --fail-on-drift
          pnpm forge --log-level info publish --channel dev --dry-run true

      - name: Resolve Docker image version
        if: inputs.channel == 'branch'
        id: docker_meta
        run: |
          {
            echo "image_tag=$(node -p 'require("./package.json").version')"
            echo "create_version=$(node -p 'require("./projects/create/package.json").version')"
            echo "repository=$(node -p 'require("./projects/create/package.json").decohere?.dockerImageRepository || "ghcr.io/typesmiths/decohere/create"')"
            echo "devcontainer_repository=$(node -p 'require("./projects/devcontainer/package.json").decohere?.dockerImageRepository || "ghcr.io/typesmiths/decohere/devcontainer"')"
          } >> "$GITHUB_OUTPUT"

      - name: Pack create CLI into Docker build context
        if: inputs.channel == 'branch'
        run: |
          node projects/create/pack-builder-tgz.mjs \
            --out-dir dist/release/projects/scaffold \
            --workspace-out dist/release \
            --dest projects/create/create.tgz
          test -f projects/create/create.tgz

      - name: Build Docker image without pushing
        if: inputs.channel == 'branch'
        run: |
          pnpm forge --log-level info docker --configuration release --dry-run
        env:
          FORGE_DOCKER_BUILD_ARGS_JSON: ${{ format('{{"CREATE_VERSION":"{0}"}}', steps.docker_meta.outputs.create_version) }}

      - name: Run packed decohere
        if: inputs.channel == 'branch'
        run: |
          image="${{ steps.docker_meta.outputs.repository }}:${{ steps.docker_meta.outputs.image_tag }}"
          docker image inspect "$image" >/dev/null
          docker run --rm --entrypoint decohere "$image" --help
          docker image inspect "${{ steps.docker_meta.outputs.devcontainer_repository }}:${{ steps.docker_meta.outputs.image_tag }}" >/dev/null

      - name: Upload release build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-release-${{ inputs.channel }}-${{ github.run_id }}
          path: dist/release/
          if-no-files-found: warn
          retention-days: 14

      - id: final-meta
        name: Capture final version metadata
        run: node ${{ env.RELEASE_SCRIPTS }}/capture-version.mjs >> "$GITHUB_OUTPUT"

  github-release:
    needs: [release]
    if: inputs.channel == 'stable' && !inputs.dry_run && needs.release.outputs.is_prerelease != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: npm-links
        run: node ${{ env.RELEASE_SCRIPTS }}/npm-links.mjs ${{ needs.release.outputs.version }} >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.release.outputs.version }}
          generate_release_notes: true
          body: ${{ steps.npm-links.outputs.links }}
