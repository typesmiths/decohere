name: CI
# Pull requests (from this repo and from forks) and the merge queue run the quick checks. A PR also
# builds images or runs Docker-backed tests when their files change. main doesn't repeat the checks,
# because the queue tested that same commit: it makes one build and uses it the way a user does. A
# fork's run gets no secrets and a read-only token: nothing here needs either.
on:
  pull_request:
  merge_group:
  push:
    branches: [main, release]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  SCRIBE_LOG_LEVEL: info
  CI_TOOLS: projects/ci-tools/src
  RELEASE_SCRIPTS: projects/ci-tools/src/release

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
      images: ${{ steps.filter.outputs.images }}
      data: ${{ steps.filter.outputs.data }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Queue runs skip the filter and the gate runs everything: what lands on main is tested whole.
      - id: filter
        if: github.event_name != 'merge_group'
        uses: dorny/paths-filter@v3
        with:
          token: ${{ github.token }}
          filters: .github/ci/code-paths-filter.yml

      - id: gate
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ||
                "${{ github.event_name }}" == "merge_group" ||
                "${{ github.ref }}" == "refs/heads/release" ||
                "${{ steps.filter.outputs.code }}" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No code paths changed — skipping CI suite (docs/meta only)"
          fi

  # Static gates — overlaps with test on wall clock.
  lint:
    name: lint/typecheck
    needs: [changes]
    if: needs.changes.outputs.run == 'true' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-node-pnpm

      - name: Run linter and type check
        run: |
          set +e
          pnpm run lint:check &
          lint_pid=$!
          pnpm run typecheck &
          tsc_pid=$!
          wait "$lint_pid"
          lint_code=$?
          wait "$tsc_pid"
          tsc_code=$?
          set -e
          if [[ "$lint_code" -ne 0 || "$tsc_code" -ne 0 ]]; then
            echo "lint exit=${lint_code} typecheck exit=${tsc_code}"
            exit 1
          fi

      # Pinned download rather than a third-party action.
      - name: Lint workflow files
        env:
          ACTIONLINT_VERSION: "1.7.7"
        run: |
          arch="$(dpkg --print-architecture)"
          case "$arch" in
            amd64 | arm64) ;;
            *) echo "Unsupported architecture: $arch"; exit 1 ;;
          esac
          curl -fsSL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_${arch}.tar.gz" \
            -o /tmp/actionlint.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color

      - name: Check for packages not on npm yet
        run: node ${{ env.CI_TOOLS }}/github/first-publish-check.mjs

      - name: Run pnpm audit
        run: |
          set +e
          pnpm audit --json > npm-audit.json
          code=$?
          set -e
          if [[ ! -s npm-audit.json ]] || ! node -e "JSON.parse(require('fs').readFileSync('npm-audit.json','utf8'))"; then
            echo "pnpm audit failed to produce JSON (exit ${code})"
            exit 1
          fi
          echo "pnpm audit wrote report (exit ${code}; high/critical gated next)"

      - name: Summarize npm audit
        run: node ${{ env.CI_TOOLS }}/audit/summarize.mjs npm-audit.json

      - name: Fail on high/critical vulnerabilities
        run: node ${{ env.CI_TOOLS }}/audit/enforce.mjs npm-audit.json

      - name: Upload npm audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          retention-days: 7
          if-no-files-found: warn

  # Two groups side by side, because the unit tests are what a PR waits for longest.
  test:
    name: test (${{ matrix.shard }}/2)
    needs: [changes]
    if: >
      needs.changes.outputs.run == 'true' &&
      github.ref != 'refs/heads/main' && github.ref != 'refs/heads/release'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-node-pnpm

      - name: Run unit tests
        run: pnpm test --shard=${{ matrix.shard }}/2

  # Enforces the thresholds on main. On release it also feeds the Pages badges.
  coverage:
    needs: [changes]
    if: >
      needs.changes.outputs.run == 'true' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-node-pnpm

      - name: Run tests with coverage
        run: pnpm run test:coverage

      - name: Upload coverage data
        if: github.ref == 'refs/heads/release'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data
          path: |
            dist/coverage/coverage-summary.json
            dist/coverage/lcov.info
          retention-days: 1

  # Real Postgres. On a PR only when data code changes; never in the queue.
  test-docker:
    name: test-docker
    needs: [changes]
    if: >
      needs.changes.outputs.run == 'true' &&
      (needs.changes.outputs.data == 'true' ||
       github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-node-pnpm

      - name: Run Docker-backed tests
        run: pnpm run test:docker

  # The one build Publish ships: verify-release uses it, then Publish uploads it.
  build:
    needs: [changes]
    if: >
      needs.changes.outputs.run == 'true' &&
      (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-node-pnpm

      # The one place a dev version is chosen; Publish reads it from this build.
      - name: Stamp the dev version
        run: pnpm forge --log-level info version --channel dev --build-number ${{ github.run_number }}

      - name: Sync cross-library dependency versions
        run: pnpm forge --log-level info dependencies --configuration release sync

      - name: Build release artifacts
        run: pnpm forge --log-level info build --configuration release

      - name: Upload release build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: forge-release-beta-${{ github.run_id }}
          path: dist/release/
          if-no-files-found: warn
          retention-days: 14

  # One release tree: npm dry-run (before pack mutates dist/release), then, when the image files
  # changed, pack once and forge docker (create + devcontainer, extra :local tag). main needs none of
  # this: verify-release builds the images and really publishes, to a temporary registry.
  package:
    name: package
    needs: [changes]
    if: needs.changes.outputs.run == 'true' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      BUILD_IMAGES: ${{ needs.changes.outputs.images == 'true' || github.ref == 'refs/heads/release' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-node-pnpm

      - name: Build release artifacts
        run: pnpm forge --log-level info build --configuration release

      - name: Verify release artifact dependency drift
        run: |
          pnpm forge --log-level info dependencies --configuration release report --fail-on-drift

      - name: Typecheck a generated app against this build
        run: pnpm exec vitest run --project e2e --silent=passed-only projects/scaffold/e2e

      - name: Dry-run npm publish
        run: |
          pnpm forge --log-level info publish --configuration release --channel dev --dry-run

      - name: Resolve Docker image version
        id: docker_meta
        if: env.BUILD_IMAGES == 'true'
        run: |
          # forge docker tags with the workspace (root) version, not the create package version.
          {
            echo "image_tag=$(node -p 'require("./package.json").version')"
            echo "create_version=$(node -p 'require("./projects/create/package.json").version')"
            echo "repository=$(node -p 'require("./projects/create/package.json").decohere?.dockerImageRepository || "ghcr.io/typesmiths/decohere/create"')"
            echo "devcontainer_repository=$(node -p 'require("./projects/devcontainer/package.json").decohere?.dockerImageRepository || "ghcr.io/typesmiths/decohere/devcontainer"')"
          } >> "$GITHUB_OUTPUT"

      - name: Pack create CLI into Docker build context
        if: env.BUILD_IMAGES == 'true'
        run: |
          node projects/create/pack-builder-tgz.mjs \
            --out-dir dist/release/projects/scaffold \
            --workspace-out dist/release \
            --dest projects/create/create.tgz
          test -f projects/create/create.tgz

      - name: Build Docker images without pushing
        if: env.BUILD_IMAGES == 'true'
        run: |
          pnpm forge --log-level info docker --configuration release --dry-run
        env:
          FORGE_DOCKER_BUILD_ARGS_JSON: ${{ format('{{"CREATE_VERSION":"{0}"}}', steps.docker_meta.outputs.create_version) }}
          FORGE_DOCKER_EXTRA_TAGS_JSON: '["${{ steps.docker_meta.outputs.repository }}:local"]'

      - name: Run packed decohere
        if: env.BUILD_IMAGES == 'true'
        run: |
          image="${{ steps.docker_meta.outputs.repository }}:${{ steps.docker_meta.outputs.image_tag }}"
          docker image inspect "$image" >/dev/null
          docker image inspect "${{ steps.docker_meta.outputs.repository }}:local" >/dev/null
          docker run --rm --entrypoint decohere "$image" --help
          docker image inspect "${{ steps.docker_meta.outputs.devcontainer_repository }}:${{ steps.docker_meta.outputs.image_tag }}" >/dev/null

      # On the base image just built, which the generated Dockerfile names by its own version.
      - name: Build a generated app's Dev Container
        if: env.BUILD_IMAGES == 'true'
        run: |
          app="$(mktemp -d)"
          repo_root="$PWD"
          (cd "$app" && printf 'pnpm\n' | node --import "$repo_root/tools/register.mjs" "$repo_root/projects/scaffold/src/cli.ts" \
            create webapi orders --database none --auth none --postman none --install no)
          from="$(sed -n 's/^FROM //p' "$app/orders/.devcontainer/Dockerfile")"
          docker tag "${{ steps.docker_meta.outputs.devcontainer_repository }}:${{ steps.docker_meta.outputs.image_tag }}" "$from"
          docker build -t generated-devcontainer "$app/orders/.devcontainer"
          user="$(docker run --rm --entrypoint id generated-devcontainer -un)"
          owner="$(docker run --rm --entrypoint stat generated-devcontainer -c %U /orders/node_modules)"
          if [[ "$user" != "node" || "$owner" != "node" ]]; then
            echo "::error::The generated Dev Container should run as node and own node_modules. User: $user. Owner: $owner."
            exit 1
          fi

      - name: Run e2e smoke tests
        if: github.ref == 'refs/heads/release'
        run: pnpm run test:e2e

  # Uses the build `build` stamped, from a temporary registry, the way a user would. Publish only
  # runs if this passes, and uploads this same build. Only on main: too slow for every PR.
  verify-release:
    name: verify-release
    needs: [changes, build]
    if: >
      needs.changes.outputs.run == 'true' &&
      (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      DECOHERE_E2E_REGISTRY: http://localhost:4873/
      DECOHERE_E2E_CONTAINER_REGISTRY: http://172.17.0.1:4873/
      # Compose asks permission to read the Dev Container tool's Dockerfile; there's no one to answer.
      BUILDX_BAKE_ENTITLEMENTS_FS: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-node-pnpm

      - name: Download the stamped build
        uses: actions/download-artifact@v4
        with:
          name: forge-release-beta-${{ github.run_id }}
          path: dist/release/

      - name: Apply the version from the build
        run: |
          pnpm forge --log-level info version --from-build --configuration release
          pnpm forge --log-level info dependencies --configuration release sync
          echo "DECOHERE_E2E_VERSION=$(node -p 'require("./package.json").version')" >> "$GITHUB_ENV"

      # First: they take seconds, and packing for the images changes dist/release.
      - name: Check the build and the forge CLI
        run: pnpm exec vitest run --project e2e --silent=passed-only projects/cli/e2e projects/forge/e2e

      - name: Start the temporary registry
        run: |
          docker run -d --name registry --network host \
            -v "$PWD/.github/ci/verdaccio.yaml:/verdaccio/conf/config.yaml:ro" \
            verdaccio/verdaccio:6.11.1
          for _ in $(seq 1 30); do
            curl -sf "$DECOHERE_E2E_REGISTRY-/ping" >/dev/null && exit 0
            sleep 1
          done
          docker logs registry
          exit 1

      - name: Publish to the temporary registry
        run: node ${{ env.RELEASE_SCRIPTS }}/publish-to-temporary-registry.mjs dist/release

      - name: Build the images without pushing
        run: |
          node projects/create/pack-builder-tgz.mjs \
            --out-dir dist/release/projects/scaffold \
            --workspace-out dist/release \
            --dest projects/create/create.tgz
          pnpm forge --log-level info docker --configuration release --dry-run
        env:
          FORGE_DOCKER_BUILD_ARGS_JSON: '{"CREATE_VERSION":"${{ env.DECOHERE_E2E_VERSION }}"}'

      - name: Check the scaffolder in the image matches its tag
        run: |
          found="$(docker run --rm --entrypoint node "ghcr.io/typesmiths/decohere/create:$DECOHERE_E2E_VERSION" \
            -p "require('/usr/local/lib/node_modules/@decohere/scaffold/package.json').version")"
          if [[ "$found" != "$DECOHERE_E2E_VERSION" ]]; then
            echo "::error::The create image tagged $DECOHERE_E2E_VERSION contains scaffolder $found."
            exit 1
          fi

      - name: Use it the way a user does
        run: pnpm exec vitest run --project e2e --silent=passed-only projects/create/e2e

      - name: Registry log
        if: failure()
        run: docker logs registry

  # Required check name stays `ci` (branch protection). Succeeds on docs-only skips.
  ci:
    needs: [changes, lint, test, coverage, test-docker, build, package, verify-release]
    if: always() && needs.changes.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job that had to run passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"' <<<"$NEEDS")"
          if [[ -n "$failed" ]]; then
            echo "$failed"
            exit 1
          fi
          echo "All passed or not needed for this run"

  release:
    if: github.ref == 'refs/heads/release'
    needs: [ci]
    uses: ./.github/workflows/release.yml
    # Default GITHUB_TOKEN is read-only; the called workflow's jobs request contents: write.
    permissions:
      contents: write
    with:
      channel: stable
    secrets: inherit
