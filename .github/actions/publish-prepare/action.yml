name: Prepare publish workspace
description: Install, download release artifacts, apply their version (dev) (repo must already be checked out)
inputs:
  ci_run_id:
    required: true
  release_channel:
    required: true
  channel:
    required: true
  configure-git:
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-node-pnpm
      with:
        configure-git: ${{ inputs.configure-git }}

    - name: Download release build artifacts
      uses: actions/download-artifact@v4
      with:
        name: forge-release-${{ inputs.release_channel }}-${{ inputs.ci_run_id }}
        run-id: ${{ inputs.ci_run_id }}
        github-token: ${{ github.token }}
        path: dist/release/

    # CI chose the version when it built; working it out again here could disagree.
    - name: Apply the version from the build
      if: ${{ inputs.channel == 'dev' }}
      shell: bash
      run: |
        pnpm forge --log-level info version --from-build --configuration release

    - name: Sync cross-library dependency versions
      if: ${{ inputs.channel == 'dev' }}
      shell: bash
      run: |
        pnpm forge --log-level info dependencies --configuration release sync

    - name: Verify release artifact dependency drift
      shell: bash
      run: |
        pnpm forge --log-level info dependencies --configuration release report --fail-on-drift
