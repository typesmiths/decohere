name: Setup Node + pnpm
description: Install pnpm and Node, configure npm registry auth, install deps, optionally set git identity
inputs:
  node-version:
    description: "Node.js version (default: .node-version)"
    required: false
    default: ""
  pnpm-version:
    description: "pnpm version (default: packageManager in package.json)"
    required: false
    default: ""
  install:
    description: Run pnpm install --frozen-lockfile
    required: false
    default: "true"
  configure-git:
    description: Configure local git user.name / user.email
    required: false
    default: "false"
  git-user-name:
    description: git user.name when configure-git is true
    required: false
    default: "typesmiths-actions[bot]"
  git-user-email:
    description: git user.email when configure-git is true
    required: false
    default: "typesmiths-actions[bot]@users.noreply.github.com"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpm-version }}

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: .node-version
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - name: Configure npm auth
      shell: bash
      run: echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Configure git identity
      if: inputs.configure-git == 'true'
      shell: bash
      run: |
        git config --local user.email "${{ inputs.git-user-email }}"
        git config --local user.name "${{ inputs.git-user-name }}"
