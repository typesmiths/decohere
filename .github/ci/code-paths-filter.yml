# Paths that require the full CI suite / npm publish.
# Docs and other meta (docs/**, *.md outside these globs, AGENTS.md, .claude/) are
# intentionally omitted — those pushes short-circuit.
code:
  - "projects/**"
  - "__mocks__/**"
  - "package.json"
  - "pnpm-lock.yaml"
  - "tsconfig.json"
  - "vitest*"
  - ".oxlintrc.json"
  - ".prettierrc.json"
  - ".prettierignore"
  - ".github/workflows/**"
  - ".github/actions/**"
  - ".github/ci/**"

# A PR builds the images only when these change. main always builds them, in verify-release.
images:
  - "projects/create/**"
  - "projects/devcontainer/**"
  - "projects/forge/src/actions/docker.action.ts"
  - ".github/workflows/ci.yml"

# A PR runs the Docker-backed tests only when these change. main always runs them.
data:
  - "projects/data/**"
