# Paths that require the full CI suite / npm publish.
# Docs and other meta (docs/**, *.md outside these globs, AGENTS.md, CLAUDE.md) are
# intentionally omitted — those pushes short-circuit.
code:
  - "projects/**"
  - "__mocks__/**"
  - "test/**"
  - "package.json"
  - "pnpm-lock.yaml"
  - "tsconfig.json"
  - "vitest*"
  - ".oxlintrc.json"
  - ".prettierrc.json"
  - ".prettierignore"
  - ".decohere.js"
  - ".github/workflows/**"
  - ".github/actions/**"
  - ".github/ci/**"
